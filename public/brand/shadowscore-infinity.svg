<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-labelledby="title desc">
  <title id="title">ShadowScore evidence network mark</title>
  <desc id="desc">Connected evidence nodes converge into one verified investigation point.</desc>
  <defs>
    <linearGradient id="shadowScoreEvidence" x1="48" x2="272" y1="32" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.48" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M72 110 116 54 160 82 204 46 248 104" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
  <path d="M72 110 116 54 160 82 204 46 248 104" fill="none" stroke="url(#shadowScoreEvidence)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 110 160 82 248 104" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
  <circle cx="72" cy="110" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="7" filter="url(#nodeGlow)"/>
  <circle cx="116" cy="54" r="15" fill="#111827" stroke="#60a5fa" stroke-width="6"/>
  <circle cx="160" cy="82" r="20" fill="#f8fafc" stroke="#818cf8" stroke-width="8" filter="url(#nodeGlow)"/>
  <circle cx="204" cy="46" r="15" fill="#111827" stroke="#a78bfa" stroke-width="6"/>
  <circle cx="248" cy="104" r="18" fill="#0f172a" stroke="#34d399" stroke-width="7" filter="url(#nodeGlow)"/>
  <circle cx="160" cy="82" r="5" fill="#312e81"/>
</svg>
