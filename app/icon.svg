<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" role="img" aria-labelledby="title desc">
  <title id="title">ShadowScore evidence network mark</title>
  <desc id="desc">Connected observations form an investigation graph around a verified point.</desc>
  <defs>
    <linearGradient id="flow" x1="20" y1="16" x2="140" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="160" height="80" rx="22" fill="#020617"/>
  <path d="M28 56 58 24 80 40 102 22 132 54" fill="none" stroke="url(#flow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 56 80 40 132 54" fill="none" stroke="#E2E8F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".68"/>
  <circle cx="28" cy="56" r="8" fill="#020617" stroke="#38BDF8" stroke-width="4" filter="url(#glow)"/>
  <circle cx="58" cy="24" r="7" fill="#020617" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="80" cy="40" r="10" fill="#F8FAFC" stroke="#818CF8" stroke-width="4" filter="url(#glow)"/>
  <circle cx="102" cy="22" r="7" fill="#020617" stroke="#A78BFA" stroke-width="4"/>
  <circle cx="132" cy="54" r="8" fill="#020617" stroke="#34D399" stroke-width="4" filter="url(#glow)"/>
</svg>
