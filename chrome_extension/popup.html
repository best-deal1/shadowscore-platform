<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ShadowScore Collector</title>
    <style>
      body { width: 360px; margin: 0; padding: 18px; background: #050505; color: white; font-family: Arial, sans-serif; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #a1a1aa; font-size: 13px; line-height: 1.5; }
      button { width: 100%; border: 1px solid rgba(248,113,113,.35); background: rgba(220,38,38,.18); color: #fff; padding: 12px; border-radius: 12px; cursor: pointer; margin-top: 10px; font-weight: 700; }
      button:hover { background: rgba(220,38,38,.28); }
      .small { font-size: 12px; color: #71717a; margin-top: 12px; }
      #status { margin-top: 12px; font-size: 13px; color: #fca5a5; }
    </style>
  </head>
  <body>
    <h1>ShadowScore Pain Collector</h1>
    <p>Scroll the group/page first, then click collect. The extension scans visible text only and downloads a JSON or CSV file.</p>
    <button id="collect">Collect Visible Pain Signals JSON</button>
    <button id="collectCsv">Collect Visible Pain Signals CSV</button>
    <div id="status"></div>
    <div class="small">No login bypass. No background scraping. It only reads the current visible page after you click.</div>
    <script src="popup.js"></script>
  </body>
</html>
